<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Valentina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c20 0%, #1a1025 50%, #2d1b3d 100%);
            font-family: 'Montserrat', sans-serif;
        }

        #stars-container, #sakura-container, #emoji-container, #shooting-stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px rgba(255, 255, 255, 1); }
        }

        /* Nueva animación de Estrellas Fugaces */
        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
            transform: rotate(-45deg);
            animation: shoot 2.5s ease-out forwards;
            opacity: 0;
            z-index: 1;
        }

        @keyframes shoot {
            0% { transform: translateX(100vw) translateY(-20vh) rotate(-45deg); opacity: 1; }
            100% { transform: translateX(-20vw) translateY(100vh) rotate(-45deg); opacity: 0; }
        }

        .petal {
            position: absolute;
            top: -20px;
            background: linear-gradient(135deg, #ffb7c5 0%, #ff8da1 100%);
            border-radius: 15px 0px 15px 0px; 
            box-shadow: 0 0 12px rgba(255, 183, 197, 0.6);
            opacity: 0.8;
            animation: fall linear forwards;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
        }

        .floating-emoji {
            position: absolute;
            bottom: -100px;
            font-size: var(--emoji-size);
            opacity: 0;
            animation: floatUp linear forwards;
            z-index: 1;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(var(--rotation)); opacity: 0; }
        }

        .valentina-text {
            font-family: 'Great Vibes', cursive;
            font-size: 7rem;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 183, 197, 1), 0 0 50px rgba(216, 180, 255, 0.8), 0 0 70px rgba(169, 92, 255, 0.7);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 4s ease-in-out, transform 4s ease-out;
            z-index: 10;
        }

        .teacher-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: #f0f0ff;
            letter-spacing: 3px;
            margin-top: 1rem;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 25px rgba(180, 140, 255, 0.7);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 3s ease-in-out, transform 3s ease-out;
            z-index: 10;
            text-align: center;
        }
        
        /* Nuevo cuadro de cristal para el mensaje extra */
        .sweet-message {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 400;
            color: #ffffff;
            margin-top: 2.5rem;
            padding: 15px 35px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 183, 197, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 0 15px rgba(255, 183, 197, 0.3) inset;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 3s ease-in-out, transform 3s ease-out;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .valentina-text { font-size: 5rem; }
            .teacher-subtitle { font-size: 1.3rem; padding: 0 20px; }
            .sweet-message { font-size: 1rem; padding: 12px 25px; margin-top: 2rem; }
        }

        .show-text {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(15, 12, 32, 0.9);
            backdrop-filter: blur(10px);
            z-index: 50;
            transition: opacity 1.5s ease;
            cursor: pointer;
        }
        
        .magic-letter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 183, 197, 0.4);
            backdrop-filter: blur(10px);
            padding: 40px 65px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(216, 180, 255, 0.3) inset;
            transition: all 0.4s ease;
            animation: pulse 2s infinite alternate;
        }

        .magic-letter:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 183, 197, 0.5) inset;
            transform: translateY(-5px) scale(1.03);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(216, 180, 255, 0.3); }
            100% { box-shadow: 0 0 35px rgba(255, 183, 197, 0.7); }
        }

        .letter-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        .letter-text {
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="relative flex items-center justify-center">

    <audio id="bg-music" src="gorgeous.mp3" loop preload="auto"></audio>

    <div id="stars-container"></div>
    <div id="shooting-stars-container"></div>
    <div id="sakura-container"></div>
    <div id="emoji-container"></div>

    <div id="start-screen">
        <div class="magic-letter">
            <div class="letter-icon">💌</div>
            <div class="letter-text">Para Valentina<br><span class="text-sm opacity-70" style="font-size: 0.9rem;">(Toca para abrir)</span></div>
        </div>
    </div>

    <!-- Textos centrales actualizados -->
    <div class="relative z-10 text-center flex flex-col items-center">
        <h1 id="name-display" class="valentina-text">Valentina</h1>
        <h2 id="subtitle-display" class="teacher-subtitle">Eres la mejor profesora de inglés</h2>
        <div id="sweet-message-display" class="sweet-message">Sigue brillando con esa magia tuya ✨</div>
    </div>

    <script>
        const floatingEmojis = ['❤️', '💖', '✨', '🌸', '👒', '⚔️', '👺', '🍥', '🦅'];

        function createStars() {
            const starsContainer = document.getElementById('stars-container');
            const numStars = 200; 
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 2.5 + 0.5;
                const duration = Math.random() * 3 + 1.5;

                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                starsContainer.appendChild(star);
            }
        }
        
        function createShootingStar() {
            const container = document.getElementById('shooting-stars-container');
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            
            // Posición inicial aleatoria en la mitad superior de la pantalla
            const startX = Math.random() * 100;
            const startY = Math.random() * 30;
            
            star.style.left = `${startX}vw`;
            star.style.top = `${startY}vh`;
            
            container.appendChild(star);
            
            // Eliminar la estrella después de la animación
            setTimeout(() => star.remove(), 2500);
        }

        function createSakuraPetal() {
            const container = document.getElementById('sakura-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const startX = Math.random() * 100;
            const size = Math.random() * 12 + 8;
            const duration = Math.random() * 6 + 4;
            const drift = (Math.random() - 0.5) * 250;
            const spin = Math.random() * 360 + 360;

            petal.style.left = `${startX}vw`;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.animationDuration = `${duration}s`;
            petal.style.setProperty('--drift', `${drift}px`);
            petal.style.setProperty('--spin', `${spin}deg`);

            container.appendChild(petal);
            setTimeout(() => petal.remove(), duration * 1000);
        }

        function createFloatingEmoji() {
            const container = document.getElementById('emoji-container');
            const emojiEl = document.createElement('div');
            emojiEl.classList.add('floating-emoji');
            
            const randomEmoji = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
            emojiEl.innerText = randomEmoji;
            
            const startX = Math.random() * 90 + 5; 
            const size = Math.random() * 2 + 1.5;
            const duration = Math.random() * 15 + 10; 
            const rotation = (Math.random() - 0.5) * 60; 

            emojiEl.style.left = `${startX}vw`;
            emojiEl.style.setProperty('--emoji-size', `${size}rem`);
            emojiEl.style.animationDuration = `${duration}s`;
            emojiEl.style.setProperty('--rotation', `${rotation}deg`);

            container.appendChild(emojiEl);
            
            setTimeout(() => emojiEl.remove(), duration * 1000);
        }

        function startExperience() {
            const music = document.getElementById('bg-music');
            music.volume = 0.7; 
            music.play().catch(e => console.log("Audio play error", e));

            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1500);

            // Explosión inicial de Sakura
            let count = 0;
            const burstInterval = setInterval(() => {
                createSakuraPetal();
                count++;
                if (count > 50) clearInterval(burstInterval);
            }, 60);

            // Lluvia constante
            setInterval(createSakuraPetal, 250);
            
            // Generar emojis lentamente
            setInterval(createFloatingEmoji, 1500); 
            
            // Generar estrellas fugaces ocasionales
            setInterval(createShootingStar, 6000); 

            // Secuencia de aparición de textos
            setTimeout(() => {
                document.getElementById('name-display').classList.add('show-text');
            }, 4000);

            setTimeout(() => {
                document.getElementById('subtitle-display').classList.add('show-text');
            }, 7500); 
            
            setTimeout(() => {
                document.getElementById('sweet-message-display').classList.add('show-text');
            }, 10500); 
        }

        window.onload = () => {
            createStars();
            const startScreen = document.getElementById('start-screen');
            startScreen.addEventListener('click', startExperience);
        };
    </script>
</body>
</html>
