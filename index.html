<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Unity Web Editor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #383838; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        /* Barra de herramientas superior */
        #toolbar { background-color: #282828; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #1a1a1a; }
        button { background-color: #444; color: white; border: 1px solid #222; padding: 5px 15px; cursor: pointer; border-radius: 3px; font-size: 13px; }
        button:hover { background-color: #555; }
        button.active { background-color: #007acc; border-color: #005a9e; }
        /* Layout principal */
        #main { display: flex; flex: 1; overflow: hidden; }
        /* Jerarquía (Barra lateral izquierda) */
        #hierarchy { width: 250px; background-color: #333; border-right: 1px solid #1a1a1a; padding: 10px; overflow-y: auto; }
        .hierarchy-item { padding: 5px; cursor: pointer; margin-bottom: 2px; border-radius: 3px; font-size: 14px; }
        .hierarchy-item:hover { background-color: #444; }
        .hierarchy-item.selected { background-color: #007acc; }
        /* Vista de Escena (Centro) */
        #viewport { flex: 1; position: relative; outline: none; }
    </style>
    <!-- Importar Three.js y controles desde CDN -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="toolbar">
        <button id="btn-translate" class="active" onclick="setMode('translate')">Mover (W)</button>
        <button id="btn-rotate" onclick="setMode('rotate')">Rotar (E)</button>
        <button id="btn-scale" onclick="setMode('scale')">Escalar (R)</button>
        <div style="width: 20px;"></div> <!-- Espaciador -->
        <button onclick="addCube()">+ Cubo</button>
        <button onclick="addSphere()">+ Esfera</button>
        <button onclick="addLight()">+ Luz</button>
    </div>

    <div id="main">
        <div id="hierarchy">
            <h4 style="margin-top: 0;">Jerarquía</h4>
            <div id="hierarchy-list"></div>
        </div>
        <div id="viewport"></div>
    </div>

    <script>
        // Variables globales
        let camera, scene, renderer;
        let orbit, transformControl;
        let raycaster, mouse;
        const objects = []; // Objetos interactuables
        let objectCounter = 1;

        init();
        animate();

        function init() {
            const viewport = document.getElementById('viewport');

            // 1. Escena y Cámara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x282828);
            
            camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);

            // 2. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            viewport.appendChild(renderer.domElement);

            // 3. Luces y Entorno (Grid)
            scene.add(new THREE.AmbientLight(0x404040, 2)); // Luz base
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7.5);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(10, 10, 0x555555, 0x444444);
            scene.add(gridHelper);

            // 4. Controles (Cámara y Herramientas)
            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            orbit.update();

            transformControl = new THREE.TransformControls(camera, renderer.domElement);
            transformControl.addEventListener('dragging-changed', function (event) {
                // Desactiva la órbita de la cámara mientras usas la herramienta de mover/rotar
                orbit.enabled = !event.value;
            });
            scene.add(transformControl);

            // 5. Raycaster (Para hacer clic y seleccionar)
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            viewport.addEventListener('mousedown', onPointerDown);

            // 6. Atajos de teclado (Estilo Unity)
            window.addEventListener('keydown', function (event) {
                switch (event.key.toLowerCase()) {
                    case 'w': setMode('translate'); break;
                    case 'e': setMode('rotate'); break;
                    case 'r': setMode('scale'); break;
                }
            });

            // Ajuste al cambiar tamaño de ventana
            window.addEventListener('resize', onWindowResize);
        }

        // --- Funciones de creación ---
        function addCube() {
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = "Cubo " + objectCounter++;
            mesh.position.y = 0.5;
            addToScene(mesh);
        }

        function addSphere() {
            const geometry = new THREE.SphereGeometry(0.6, 32, 16);
            const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = "Esfera " + objectCounter++;
            mesh.position.y = 0.6;
            addToScene(mesh);
        }

        function addLight() {
            const light = new THREE.PointLight(0xffffff, 1, 10);
            // Representación visual de la luz
            const sphereSize = 0.2;
            const pointLightHelper = new THREE.Mesh(
                new THREE.SphereGeometry(sphereSize, 8, 8),
                new THREE.MeshBasicMaterial({color: 0xffff00, wireframe: true})
            );
            light.add(pointLightHelper);
            light.name = "Luz " + objectCounter++;
            light.position.set(0, 2, 0);
            addToScene(light);
        }

        function addToScene(object) {
            scene.add(object);
            objects.push(object);
            updateHierarchy();
            selectObject(object);
        }

        // --- Lógica de Selección e Interfaz ---
        function onPointerDown(event) {
            // Prevenir selección si estamos haciendo clic en los controles de transformación
            if(transformControl.axis !== null) return; 

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                selectObject(intersects[0].object);
            } else {
                deselectAll();
            }
        }

        function selectObject(object) {
            transformControl.attach(object);
            updateHierarchySelection(object);
        }

        function deselectAll() {
            transformControl.detach();
            updateHierarchySelection(null);
        }

        function setMode(mode) {
            transformControl.setMode(mode);
            document.getElementById('btn-translate').classList.remove('active');
            document.getElementById('btn-rotate').classList.remove('active');
            document.getElementById('btn-scale').classList.remove('active');
            document.getElementById('btn-' + mode).classList.add('active');
        }

        // --- Lógica de Jerarquía (UI Lateral) ---
        function updateHierarchy() {
            const list = document.getElementById('hierarchy-list');
            list.innerHTML = '';
            objects.forEach(obj => {
                const div = document.createElement('div');
                div.className = 'hierarchy-item';
                div.textContent = obj.name;
                div.onclick = () => selectObject(obj);
                // Relacionar el elemento DOM con el objeto 3D
                div.dataset.uuid = obj.uuid; 
                list.appendChild(div);
            });
        }

        function updateHierarchySelection(selectedObj) {
            const items = document.querySelectorAll('.hierarchy-item');
            items.forEach(item => {
                item.classList.remove('selected');
                if (selectedObj && item.dataset.uuid === selectedObj.uuid) {
                    item.classList.add('selected');
                }
            });
        }

        // --- Render Loop ---
        function onWindowResize() {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
